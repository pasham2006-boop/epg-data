name: EPG Yenile

on:
  schedule:
    - cron: '0 3 * * *'      # her gün 06:00 TR
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dizi-epg
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install
      - run: node engine.mjs
      - name: Commit & Push
        run: |
          git config user.name  "epg-bot"
          git config user.email "epg-bot@users.noreply.github.com"
          git add dizi-epg.json dizi-epg.xml
          if git diff --staged --quiet; then echo "Değişiklik yok";
          else git commit -m "EPG $(date -u +%F)"; git push; fi
